[package]
name = "steamguard"
version = "1.3.2"
description = "Local authenticator and Steam mobile confirmations"
authors = ["kasen"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steamguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-quick-access = { path = "plugins/quick-access" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "system-proxy", "socks"] }
rsa = "0.9"
prost = "0.13"
rmpv = { version = "1", features = ["with-serde"] }
lz4_flex = "0.11"
roxmltree = "0.20"
opendal = { version = "=0.59.5", default-features = false, features = ["services-webdav", "http-transport-reqwest-rustls-no-provider", "executors-tokio"] }
automerge = "=0.12.0"
tokio = { version = "1", features = ["macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
http = "1"
opendal-http-transport-reqwest = { version = "=0.59.5", default-features = false, features = ["rustls-no-provider"] }
reqwest-sync = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "socks"] }
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rpassword = "7"
