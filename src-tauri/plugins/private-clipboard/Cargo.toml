[package]
name = "tauri-plugin-private-clipboard"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-private-clipboard"
license = "GPL-3.0-only"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
cc = "1"
