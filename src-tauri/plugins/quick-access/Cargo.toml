[package]
name = "tauri-plugin-quick-access"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-quick-access"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
tauri = "2"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde_json = "1"
windows = { version = "0.62", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT"] }

[dev-dependencies]
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde_json = "1"

[build-dependencies]
cc = "1"
tauri-plugin = { version = "2", features = ["build"] }
